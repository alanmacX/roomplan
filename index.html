<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能家居</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="room.css">
<link rel="icon" href="data:,">
</head>
<body>
<main class="sheet">
  <div class="workspace">
    <section class="stage-shell" aria-label="户型视图">
      <div class="viewport" id="viewport" aria-label="同一个模型的 2D 和 3D 视图">
        <img id="fallback" src="assets/apple-roomplan/original-perspective.png" alt="Apple RoomPlan 客厅扫描模型的预览">
        <p id="renderError" class="render-error" role="status" hidden>无法启动 3D 渲染 · 显示客厅预览</p>
      </div>
      <div class="view-tools glass">
        <div class="view-switch" role="group" aria-label="视角">
          <button id="orbitView" type="button" aria-pressed="true">3D</button>
          <button id="topView" type="button" aria-pressed="false">2D</button>
        </div>
        <div class="view-actions">
          <button type="button" id="walkToggle" aria-pressed="false">进入户型</button>
          <button type="button" id="reset" aria-label="复位视角" title="复位视角">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v5h5M4.5 9A8 8 0 1 1 4 15"/></svg>
          </button>
        </div>
      </div>
    </section>
    <aside class="details glass" aria-label="房间和设备">
      <section class="rooms-panel" aria-labelledby="roomsTitle">
        <div class="detail-heading"><h2 id="roomsTitle">房间</h2><button id="wholeHome" type="button" aria-pressed="true">全屋</button></div>
        <div id="roomList" class="room-list" aria-label="定位房间"></div>
        <div id="adjacent" class="adjacent" hidden><div class="detail-heading"><h2>通往</h2></div><div id="roomLinks" class="room-list"></div></div>
        <p id="walkStatus" class="walk-status" role="status" hidden></p>
      </section>
      <details class="furniture-panel"><summary>家具显示</summary>
        <label class="visibility"><input id="objects" type="checkbox" checked><span>显示家具</span></label>
        <ul id="legend" class="legend" aria-label="家具分类"></ul>
        <label class="color-setting"><input id="colors" type="checkbox" checked> 按类别着色</label>
      </details>
      <section class="lighting" aria-labelledby="lightTitle">
        <div class="detail-heading"><h2 id="lightTitle">客厅灯泡</h2><button id="installBulb" type="button" aria-pressed="false">安装灯泡</button></div>
        <p class="placement-note" id="bulbNotice" role="status"></p>
        <div class="bulb-list" id="bulbList" role="group" aria-label="已安装灯泡"></div>
        <div id="bulbControls" hidden>
          <div class="bulb-actions">
            <button id="lamp" type="button" aria-pressed="false">开灯</button>
            <button id="inspectBulb" type="button" aria-pressed="false">看细节</button>
            <button id="removeBulb" type="button">移除</button>
          </div>
          <label class="level" for="brightness"><span>亮度</span><output id="brightnessValue">60%</output></label>
          <input type="range" id="brightness" min="1" max="100" value="60">
        </div>
      </section>
      <footer class="source"><a href="https://developer.apple.com/documentation/roomplan/merging-multiple-scans-into-a-single-structure">Apple RoomPlan 样例</a></footer>
    </aside>
  </div>
</main>
<script src="vendor/three.min.js"></script>
<script src="assets/apple-roomplan/home-mesh.js"></script>
<script src="assets/led-bulb/bulb.js"></script>
<script src="api.js"></script>
<script src="bulbs.js"></script>
<script src="walk.js"></script>
<script src="room.js"></script>
</body>
</html>
